name: gateway

# The gateway consumes the PUBLISHED publisher and consumer packages from the registry (not the sibling source
# trees), at the versions package-lock.json records, so a broken release would surface here. The behaviour
# scenarios and the fitness functions run it against the source builds instead (bdd.yml).
# Node 22 and 24 must pass; Node 26 is reported but does not block.

on:
  push:
    paths:
      - "gateway/**"
      - "example-responses/**"
      - "schemas-validators/**"
      - "sfc-compliance/vectors/**"
      - "sfc-compliance/examples/**"
      - "sfc-compliance/schemas/**"
      - ".github/workflows/gateway.yml"
  pull_request:
    paths:
      - "gateway/**"
      - "example-responses/**"
      - "schemas-validators/**"
      - "sfc-compliance/vectors/**"
      - "sfc-compliance/examples/**"
      - "sfc-compliance/schemas/**"
      - ".github/workflows/gateway.yml"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.node == '26' }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "${{ matrix.node }}"
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Install dependencies
        working-directory: gateway
        run: npm ci

      - name: Typecheck
        working-directory: gateway
        run: npm run typecheck

      - name: Build
        working-directory: gateway
        run: npm run build

      - name: Test
        working-directory: gateway
        run: npm test

      # Boots the real server and runs the repo's own conformance battery
      # against the root report and every registered subject. Startup is
      # fail-loud: any data file that does not round-trip through the
      # publisher pipeline aborts the boot, so this also gates data/*.json.
      # The battery fires hundreds of requests from one address, so the
      # per-client rate limit is switched off for it (the limiter has its own tests).
      - name: Conformance battery against a live instance
        working-directory: gateway
        run: |
          RATE_LIMIT_PER_MINUTE=0 PORT=8080 node dist/index.js &
          GATEWAY_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz || { echo "gateway did not become healthy"; kill $GATEWAY_PID; exit 1; }
          STATUS=0
          npm run conformance -- http://127.0.0.1:8080 --allow-http || STATUS=$?
          kill $GATEWAY_PID
          exit $STATUS
