name: sfc-compliance

on:
  push:
    paths:
      - "sfc-compliance/**"
      - ".github/workflows/sfc-compliance.yml"
  pull_request:
    paths:
      - "sfc-compliance/**"
      - ".github/workflows/sfc-compliance.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sfc-compliance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The lockfile pins the published consumer library and the test tools.
      - name: Install
        run: npm ci

      # The Python cross-check of the vectors needs python3; setup-python makes that independent of the runner image.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # npm test regenerates the vectors into a temporary folder, checks they equal the committed
      # files, and runs the Python cross-check (vectors/crosscheck.py), so there is no separate
      # cross-check step. SFC_REQUIRE_PYTHON makes the test fail, not skip, when python3 is missing
      # (test/vectors.test.mjs reads it).
      - name: Test
        run: npm test
        env:
          SFC_REQUIRE_PYTHON: "1"

      - name: Check the two reference declarations
        run: npm run check

      - name: Check code complexity
        run: npm run lint
