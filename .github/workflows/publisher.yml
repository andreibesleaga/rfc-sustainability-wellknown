name: publisher

# Node 22 and 24 must pass; Node 26 is reported but does not block.

on:
  push:
    paths:
      - "publisher/**"
      - "schemas-validators/**"
      - "example-responses/**"
      - ".github/workflows/publisher.yml"
  pull_request:
    paths:
      - "publisher/**"
      - "schemas-validators/**"
      - "example-responses/**"

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.node == '26' }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    defaults:
      run:
        working-directory: publisher
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "${{ matrix.node }}"
          cache: npm
          cache-dependency-path: publisher/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  cross-validate:
    # Generate a live document and validate it with the repo's independent
    # Python (JTD) and Ruby (CDDL) validators — proves the publisher's output is conformant.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.2" }
      - name: Install validators (jtd in a virtual environment, cddl gem 0.12.14 on the PATH)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r schemas-validators/requirements.txt
          echo "PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
          gem install cddl -v 0.12.14
          echo "$(ruby -e 'print Gem.bindir')" >> "$GITHUB_PATH"
      - name: Build publisher
        working-directory: publisher
        run: |
          npm ci
          npm run build
      - name: Generate a document and validate it
        run: |
          cddl --version | grep -q '0.12.14'
          node publisher/bin/sustainability-publisher.js \
            --config publisher/examples/config.computed.json --once > "$RUNNER_TEMP/gen.json"
          cat "$RUNNER_TEMP/gen.json"
          cd schemas-validators
          "$PYTHON" validator-json.py "$RUNNER_TEMP/gen.json"
          "$PYTHON" validator-cddl.py "$RUNNER_TEMP/gen.json"
