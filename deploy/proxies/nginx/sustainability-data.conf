# Three lines that matter; the full hardened file is ../../../server-configurations/nginx.conf
# `location =` matches the path only: any query string (?start=..., ?foo=1) gets the same file, as a Basic server must.
# Caching: nginx sends ETag and Last-Modified for the file itself and answers If-None-Match with 304.
# If the path is proxied to an application that computes answers to query parameters (an Extended server), also
# rate-limit it: in http { } add   limit_req_zone $binary_remote_addr zone=sustainability:1m rate=10r/s;
# and below add   limit_req zone=sustainability burst=20 nodelay;   (the answer is then 503 or 429 per limit_req_status).
location = /.well-known/sustainability-data {
    default_type application/sustainability-data+json;
    add_header Cache-Control "public, max-age=86400" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
}
