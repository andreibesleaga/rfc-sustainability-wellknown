name: consumer

# Node 22 and 24 must pass; Node 26 is reported but does not block.

on:
  push:
    paths:
      - "consumer/**"
      - "publisher/**"
      - "schemas-validators/**"
      - "example-responses/**"
      - ".github/workflows/consumer.yml"
  pull_request:
    paths:
      - "consumer/**"
      - "publisher/**"
      - "schemas-validators/**"
      - "example-responses/**"

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.node == '26' }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "${{ matrix.node }}"
          cache: npm
          cache-dependency-path: consumer/package-lock.json

      # The interop and identity tests import the publisher's built dist/ directly
      # (both packages live in the same repo): it must be built first.
      - name: Build publisher (for the interop test)
        working-directory: publisher
        run: |
          npm ci
          npm run build

      - name: Install consumer dependencies
        working-directory: consumer
        run: npm ci

      - name: Typecheck
        working-directory: consumer
        run: npm run typecheck

      - name: Build consumer
        working-directory: consumer
        run: npm run build

      - name: Test
        working-directory: consumer
        run: npm test
