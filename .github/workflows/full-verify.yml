name: full-verify

# The single, unconditional "is the whole repo green" check — unlike the other
# workflows (draft.yml, publisher.yml, consumer.yml, example-scripts.yml), which are path-filtered to their own area, this one
# always runs on every push/PR to main and re-verifies every area in one place.
# Intended as the required status check for branch protection.
# Node 22 and 24 must pass in the library jobs; Node 26 is reported but does not block.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.2" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: gem install kramdown-rfc2629
      - run: python3 -m pip install xml2rfc
      - name: Build and strict-check the latest draft
        run: |
          set -e
          cd internet-drafts
          md=$(ls draft-besleaga-sustainability-wellknown-[0-9][0-9].md | sort -V | tail -1)
          base="${md%.md}"
          # The same pipeline as build.sh: RFCXML v3 vocabulary, then the idnits3 clean-up.
          kramdown-rfc -3 "$md" > "$base.v2.xml"
          xml2rfc --v2v3 --strict "$base.v2.xml" -o "$base.xml"
          python3 v3-postprocess.py "$base.xml"
          xml2rfc --strict --text "$base.xml" -o "$base.txt"
      - name: idnits3, normal mode (no nit at all)
        run: |
          cd internet-drafts
          md=$(ls draft-besleaga-sustainability-wellknown-[0-9][0-9].md | sort -V | tail -1)
          base="${md%.md}"
          npx --yes @ietf-tools/idnits -m normal --no-progress --no-color "$base.xml" | tee /tmp/idnits.out
          n=$(npx --yes @ietf-tools/idnits -m normal -o count --no-progress "$base.xml" | tail -1)
          if [ "$n" != "0" ]; then echo "::error::idnits3 reports $n nit(s)"; exit 1; fi
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.node == '26' }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - name: Build publisher and consumer (the tools use their builds)
        run: |
          (cd publisher && npm ci --no-audit --no-fund && npm run build)
          (cd consumer  && npm ci --no-audit --no-fund && npm run build)
          bash scripts/overlay-source-publisher.sh tools/create-sustainability-data
      - name: report-to-declaration tests
        working-directory: tools/report-to-declaration
        run: node --test test/*.test.mjs
      - name: report-to-declaration demonstration (writes a candidate, never a declaration, without a reviewer)
        working-directory: tools/report-to-declaration
        run: |
          set +e
          node extract.mjs --source fixtures/demo-report.txt --replay fixtures/demo-model-reply.json \
            --target "Example Hosting Ltd" --methodology-uri https://hosting.example/reports/2025.pdf \
            --target-type organization --source-differs --out out
          code=$?
          set -e
          [ "$code" -eq 3 ] && test -f out/candidate.json && ! test -f out/declaration.json
      - name: create-sustainability-data tests
        working-directory: tools/create-sustainability-data
        run: node --test test/*.test.mjs

  bdd-and-fitness:
    # The scenarios and the fitness functions run against the SOURCE builds of the
    # three packages, so a regression is caught before a release, not after.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.node == '26' }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.2" }
      - name: Validators (jtd in a virtual environment, cddl gem 0.12.14 on the PATH)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r schemas-validators/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
          gem install cddl -v 0.12.14
          echo "$(ruby -e 'print Gem.bindir')" >> "$GITHUB_PATH"
      - name: Build publisher and consumer, then the gateway and the initializer against those source builds
        run: |
          cddl --version 2>&1 | grep -q '0.12.14'   # the gem prints its version on stderr
          (cd publisher && npm ci --no-audit --no-fund && npm run build)
          (cd consumer  && npm ci --no-audit --no-fund && npm run build)
          bash scripts/overlay-source-libs.sh
          bash scripts/overlay-source-publisher.sh tools/create-sustainability-data
      - name: Traceability (every normative sentence of the draft has a scenario)
        working-directory: bdd
        run: npm ci --no-audit --no-fund && npm run trace
      - name: Behaviour scenarios
        working-directory: bdd
        run: npm test
      - name: Architecture fitness functions
        working-directory: fitness
        run: npm test

  schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.2" }
      - name: Validators (jtd in a virtual environment, cddl gem 0.12.14 on the PATH)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r schemas-validators/requirements.txt
          echo "PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
          gem install cddl -v 0.12.14
          echo "$(ruby -e 'print Gem.bindir')" >> "$GITHUB_PATH"
      - name: Generated corpus files equal a fresh run (all-pairs set, signed files, served examples)
        working-directory: schemas-validators
        run: |
          node gen/pairwise.mjs --check
          node gen/signed.mjs --check
          node gen/served.mjs --check
      - name: Validate the corpus and every served example (both validators, verdicts from the manifest)
        working-directory: schemas-validators
        run: |
          cddl --version 2>&1 | grep -q '0.12.14'   # the gem prints its version on stderr
          bash validate-all.sh
      # Three-way schema equality (schemas-validators/response-schema.json ==
      # publisher/src/schema.ts == consumer/src/schema.ts) is enforced by each
      # package's own test suite: publisher/test/conformance.test.ts and
      # consumer/test/schema.test.ts both assert their embedded TS schema is
      # byte-identical to the repo JSON. Those run in the `publisher`/`consumer`
      # jobs below (via `npm test`), so no separate equality step is needed here.

  publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.node == '26' }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    defaults:
      run:
        working-directory: publisher
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}", cache: npm, cache-dependency-path: publisher/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm publish --dry-run
        if: matrix.node == '22'

  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.node == '26' }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - name: Build publisher (consumer's interop test needs its dist/)
        working-directory: publisher
        run: npm ci; npm run build
      - name: Build and test consumer
        working-directory: consumer
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
      - name: Dry-run publish
        if: matrix.node == '22'
        working-directory: consumer
        run: npm publish --dry-run

  gateway:
    # Against the SOURCE builds of the publisher and the consumer (scripts/overlay-source-libs.sh leaves
    # gateway/package-lock.json alone); gateway.yml runs it against the versions the registry serves.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.node == '26' }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - name: Build publisher and consumer, then the gateway against those source builds
        run: |
          (cd publisher && npm ci --no-audit --no-fund && npm run build)
          (cd consumer  && npm ci --no-audit --no-fund && npm run build)
          bash scripts/overlay-source-libs.sh
      - name: Typecheck and test
        working-directory: gateway
        run: |
          npm run typecheck
          npm test
      - name: Conformance battery against a live instance (rate limit off, since one address sends hundreds of requests)
        working-directory: gateway
        run: |
          RATE_LIMIT_PER_MINUTE=0 PORT=8080 node dist/index.js &
          GATEWAY_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz || { echo "gateway did not become healthy"; kill $GATEWAY_PID; exit 1; }
          STATUS=0
          npm run conformance -- http://127.0.0.1:8080 --allow-http || STATUS=$?
          kill $GATEWAY_PID
          exit $STATUS

  example-scripts-and-server-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3" }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.2" }
      - run: python3 -m pip install -r schemas-validators/requirements.txt
      - run: gem install cddl -v 0.12.14
      - name: example-scripts test suites
        working-directory: example-scripts
        run: |
          python3 test_security.py
          node test_security.js
          php test_security.php
          python3 test_request_handler.py
      - name: Install nginx and apache2
        # A stalled package mirror once held this step (and every deploy waiting on CI) for 38 minutes.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dpkg::Options::=--force-confold install -y nginx apache2
      - name: Live server-configuration check (see server-configurations/README.md)
        run: |
          set -e
          mkdir -p /tmp/nginx-fv/logs /tmp/nginx-fv/run /tmp/nginx-fv/tmp
          echo '{"test":true}' > /tmp/nginx-fv/sustainability.json
          { echo 'worker_processes 1; pid /tmp/nginx-fv/run/nginx.pid; error_log /tmp/nginx-fv/logs/error.log;'; \
            echo 'events{worker_connections 16;} http{ access_log /tmp/nginx-fv/logs/access.log;'; \
            echo 'client_body_temp_path /tmp/nginx-fv/tmp/body; proxy_temp_path /tmp/nginx-fv/tmp/proxy;'; \
            echo 'fastcgi_temp_path /tmp/nginx-fv/tmp/fastcgi; uwsgi_temp_path /tmp/nginx-fv/tmp/uwsgi; scgi_temp_path /tmp/nginx-fv/tmp/scgi;'; \
            echo 'server{ listen 127.0.0.1:8099;'; \
            sed 's#/var/www/metadata/sustainability.json#/tmp/nginx-fv/sustainability.json#' server-configurations/nginx.conf | grep -v '^#'; \
            echo '} }'; } > /tmp/nginx-fv/nginx.conf
          nginx -t -c /tmp/nginx-fv/nginx.conf
          nginx -c /tmp/nginx-fv/nginx.conf
          sleep 1
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/.well-known/sustainability-data)" = "200" ]
          curl -s -D - -o /dev/null http://127.0.0.1:8099/.well-known/sustainability-data | grep -qi '^Access-Control-Allow-Origin: \*'
          curl -s -D - -o /dev/null -X POST http://127.0.0.1:8099/.well-known/sustainability-data | grep -qi '^Allow: GET, HEAD'
          nginx -s stop -c /tmp/nginx-fv/nginx.conf

      - name: Apache config check
        run: |
          set -e
          mkdir -p /tmp/apache-fv/logs /tmp/apache-fv/run /tmp/apache-fv/htdocs
          echo '{"test":true}' > /tmp/apache-fv/htdocs/sustainability.json
          echo '{"error":"method not allowed"}' > /tmp/apache-fv/htdocs/sustainability-405.json
          cat > /tmp/apache-fv/httpd.conf <<EOF
          ServerRoot "/tmp/apache-fv"
          Listen 127.0.0.1:8098
          PidFile "/tmp/apache-fv/run/httpd.pid"
          ErrorLog "/tmp/apache-fv/logs/error.log"
          LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
          LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
          LoadModule alias_module /usr/lib/apache2/modules/mod_alias.so
          LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
          LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so
          LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
          User $(whoami)
          Group $(id -gn)
          ServerName localhost
          TypesConfig /etc/mime.types
          EOF
          sed "s#/var/www/metadata/sustainability-405.json#/tmp/apache-fv/htdocs/sustainability-405.json#; s#/var/www/metadata/sustainability.json#/tmp/apache-fv/htdocs/sustainability.json#" \
            server-configurations/apache.conf | grep -v '^#' >> /tmp/apache-fv/httpd.conf
          apache2 -f /tmp/apache-fv/httpd.conf -t
          apache2 -f /tmp/apache-fv/httpd.conf -k start
          sleep 1
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8098/.well-known/sustainability-data)" = "200" ]
          curl -s -D - -o /dev/null http://127.0.0.1:8098/.well-known/sustainability-data | grep -qi '^Access-Control-Allow-Origin: \*'
          post=$(curl -s -D - -o /dev/null -X POST http://127.0.0.1:8098/.well-known/sustainability-data)
          echo "$post" | grep -qi "^Allow: GET, HEAD"
          apache2 -f /tmp/apache-fv/httpd.conf -k stop

  summary:
    needs: [draft, tools, bdd-and-fitness, schemas, publisher, consumer, gateway, example-scripts-and-server-configs]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          echo "All areas verified green: draft, tools, bdd-and-fitness, schemas, publisher, consumer, gateway, example-scripts, server-configurations."
