# Dependency update configuration.
#
# Security updates are enabled repository-wide in GitHub's settings; this file adds
# scheduled version updates for each npm workspace and for the Actions used by CI.
#
# Grouping keeps the PR volume low: one PR per ecosystem per week for the routine
# bumps, with major versions separated so a breaking change is never mixed into a
# batch of patches.
version: 2
updates:
  - package-ecosystem: npm
    directory: /publisher
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /consumer
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /gateway
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /gateway
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
