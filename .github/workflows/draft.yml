name: draft

on:
  push:
    paths:
      - "internet-drafts/**"
      - ".github/workflows/draft.yml"
  pull_request:
    paths:
      - "internet-drafts/**"

jobs:
  build-id:
    # Build the latest Internet-Draft from Markdown to XML and text, and run
    # idnits-style checks. Fails the build if kramdown-rfc or xml2rfc error.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.2" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install kramdown-rfc and xml2rfc
        run: |
          gem install kramdown-rfc2629
          python3 -m pip install xml2rfc
      - name: Determine latest draft
        id: draft
        run: |
          latest=$(ls internet-drafts/draft-besleaga-sustainability-wellknown-*.md | sort | tail -1)
          echo "md=$latest" >> "$GITHUB_OUTPUT"
          echo "Latest draft: $latest"
      - name: Build XML + text
        run: |
          md="${{ steps.draft.outputs.md }}"
          base="${md%.md}"
          # RFCXML v3 vocabulary, as build.sh does: kramdown-rfc -3 still emits
          # <spanx>/<list> and <?line?> PIs, which the Datatracker's idnits3
          # reports one warning each; --v2v3 rewrites the elements, sed drops the PIs.
          kramdown-rfc -3 "$md" > "$base.v2.xml"
          xml2rfc --v2v3 --strict "$base.v2.xml" -o "$base.xml"
          rm -f "$base.v2.xml"
          python3 internet-drafts/v3-postprocess.py "$base.xml"
          # --strict surfaces long-line and other rendering warnings as part of CI.
          xml2rfc --strict --text "$base.xml" -o "$base.txt"
      - name: idnits3 (normal mode, as author-tools.ietf.org/idnits3 runs it)
        run: |
          base="${{ steps.draft.outputs.md }}"; base="${base%.md}"
          n=$(npx --yes @ietf-tools/idnits -m normal -o count --no-progress "$base.xml" | tail -1)
          npx --yes @ietf-tools/idnits -m normal --no-progress --no-color "$base.xml" || true
          if [ "$n" != "0" ]; then echo "::error::idnits3 reports $n nit(s)"; exit 1; fi
      - name: Sanity checks
        run: |
          base="${{ steps.draft.outputs.md }}"; base="${base%.md}"
          # No leaked code-fence markers in the rendered text.
          if grep -q '```' "$base.txt"; then echo "::error::leaked code fences in rendered draft"; exit 1; fi
          # The corrected reference tags must resolve in the References section.
          grep -q "\[RFC8610\]" "$base.txt"
          grep -q "\[RFC7493\]" "$base.txt"
          grep -q "\[RFC8927\]" "$base.txt"
          # The stale CDDL reference (RFC 8949 = CBOR) must no longer be a reference entry.
          if grep -q "\[RFC8949\]" "$base.txt"; then echo "::error::stale RFC 8949 reference present"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: internet-draft
          path: |
            internet-drafts/*.xml
            internet-drafts/*.txt
