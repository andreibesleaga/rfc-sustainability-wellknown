# HAProxy 2.2+: answer the declaration straight from the proxy (no backend needed for that path).
# The file /etc/haproxy/sustainability-data is read once at start-up: after each monthly refresh run
#   haproxy -c -f /etc/haproxy/haproxy.cfg && systemctl reload haproxy
defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend www
    bind :8080
    acl decl path /.well-known/sustainability-data
    acl ok_method method GET HEAD
    http-request return status 405 content-type "application/json" string "{\"error\":\"method not allowed\"}" hdr Allow "GET, HEAD" if decl !ok_method
    http-request return status 200 content-type "application/sustainability-data+json" file /etc/haproxy/sustainability-data hdr X-Content-Type-Options nosniff hdr Access-Control-Allow-Origin "*" hdr Cache-Control "public, max-age=86400" if decl
    default_backend app

backend app
    server app1 127.0.0.1:3000
